<svg width="450" height="450" viewBox="0 0 450 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    .trunk {
      fill: #332c29;
      opacity: 0;
      animation: fadeIn 1.5s ease-out forwards;
    }
    .leaf-cluster {
      transform-origin: center;
      opacity: 0;
      animation: growAndRotate 1.5s ease-out forwards;
    }
    .leaf-green { animation-delay: 0.5s; }
    .leaf-teal { animation-delay: 1.0s; }
    .leaf-blue { animation-delay: 1.5s; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes growAndRotate {
      from { opacity: 0; transform: scale(0) rotate(-30deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }
  </style>

