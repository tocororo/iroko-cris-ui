<div class="properties-grid">
  @for (prop of getNodeProperties(); track prop.key) { @if
  (!isObject(prop.value)) {
  <div class="property-item">
    <div class="property-value-container">
      @if (isArray(prop.value)) {
      <strong class="property-label">{{ prop.key }}:</strong>
      <div class="array-container">
        <ul class="array-list">
          @for (item of prop.value; track item) {
          <li class="array-list-item">
            <span class="array-item-content">{{ item }}</span>
          </li>
          }
        </ul>
      </div>
      } @else if (!isObject(prop.value)) {
      <span class="property-value">
        <strong class="property-label">{{ prop.key }}:</strong> {{ prop.value }}
      </span>
      }
      <!-- } @else if (isObject(prop.value)) {
      <div class="json-container">
        <ngx-json-viewer
          [json]="prop.value"
          [expanded]="false"
        ></ngx-json-viewer>
      </div> -->
    </div>
  </div>
  } }
</div>
