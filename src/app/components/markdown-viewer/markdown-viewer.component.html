<div class="markdown-container">
  @if (src) {
  <markdown
    [src]="src"
    (load)="onMarkdownLoad()"
    (error)="onMarkdownError($event)"
  >
  </markdown>
  } @else {
  <markdown
    [data]="content"
    (load)="onMarkdownLoad()"
    (error)="onMarkdownError($event)"
  >
  </markdown>
  }
</div>
