<div class="relationships-tab-content">
  <!-- Search and Export Actions -->
  <div class="search-actions">
    <!-- Export Button -->
    <button
      mat-raised-button
      color="primary"
      (click)="onExport()"
      [disabled]="isExporting || group.relationships.length === 0"
      class="export-button"
    >
      <mat-icon *ngIf="!isExporting">download</mat-icon>
      @if (isExporting){
      <mat-progress-spinner
        diameter="16"
        mode="indeterminate"
        class="export-spinner"
      ></mat-progress-spinner>
      }
      {{ isExporting ? "Exportando..." : "Exportar CSV" }}
    </button>
  </div>

  <!-- Search Component -->
  <app-relationship-search
    [groupType]="group.type"
    [searchTerm]="group.searchTerm || ''"
    [isLoading]="group.isLoading"
    [isSearching]="group.isSearching || false"
    [showSearch]="group.showSearch || false"
    (search)="onSearch($event)"
    (searchClear)="onSearchClear()"
  ></app-relationship-search>

  <!-- List Component -->
  <app-relationship-list
    [group]="group"
    (nodeSelected)="onNodeSelected($event)"
    (nodeDelete)="onNodeDelete($event)"
  ></app-relationship-list>

  <!-- Pagination -->
  @if (shouldShowPagination()) {
  <app-relationship-pagination
    [currentPage]="group.currentPage"
    [pageSize]="group.pageSize"
    [totalItems]="group.totalCount"
    [isLoading]="group.isLoading"
    (pageChange)="onPageChange($event)"
  ></app-relationship-pagination>
  }
</div>
