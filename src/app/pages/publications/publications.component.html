<!-- src/app/pages/sources/sources.component.html -->
<div class="page-container">
  <div class="page-header">
    <h1>Catálogo</h1>
    <p>
      Revistas científicas, repositorios de datos y fuentes de información de
      diversos ámbitos.
    </p>
  </div>

  @if (filters && filters.length > 0) {
  <app-generic-list
    entityType="Publication"
    [columns]="sourceColumns"
    label="Sources"
    [defaultSort]="'title'"
    [defaultSortOrder]="'ASC'"
    [pageSize]="10"
    (nodeSelected)="onNodeSelected($event)"
    [filters]="filters"
  >
  </app-generic-list>
  } @else {
  <app-generic-list
    entityType="Publication"
    [columns]="sourceColumns"
    label="Sources"
    [defaultSort]="'title'"
    [defaultSortOrder]="'ASC'"
    [pageSize]="10"
    (nodeSelected)="onNodeSelected($event)"
  >
  </app-generic-list>
  }
</div>
