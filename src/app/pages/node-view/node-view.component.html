<div class="node-view-page">
  <div class="page-header">
    <!-- <mat-card-header>
      <mat-card-title>
        {{ node.name || node.title || node.id }}
      </mat-card-title>
      <mat-card-subtitle>
        <mat-chip class="entity-type-chip">{{ nodeType }}</mat-chip>
      </mat-card-subtitle>
    </mat-card-header>

    <button mat-button (click)="goBack()" class="back-button">
      <mat-icon>arrow_back</mat-icon>
      Volver a {{ getBreadcrumbLabel() }}
    </button> -->
  </div>

  <mat-tab-group [(selectedIndex)]="activeTab" class="node-view-tabs">
    <!-- Tab 1: Node Details -->
    <mat-tab label="Detalles del Nodo">
      <div class="tab-content">
        <div class="node-viewer-container">
          <app-enhanced-node-viewer
            [nodeId]="nodeId"
            [nodeType]="nodeType"
            (nodeLoaded)="onNodeLoaded($event)"
            (nodeSelected)="onRelatedNodeSelect($event)"
          >
          </app-enhanced-node-viewer>
        </div>
      </div>
    </mat-tab>

    <!-- Tab 2: Evaluations -->
    <mat-tab label="Evaluaciones">
      <div class="tab-content">
        <app-node-evaluations [nodeId]="nodeId" [nodeType]="nodeType">
        </app-node-evaluations>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
